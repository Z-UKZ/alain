<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>منصة مساجد العين</title>
  
  <link rel="icon" type="image/png" href="https://www.awqaf.gov.ae/assets/mediakit/AwqafLogoIcon.png">
  
  <link rel="apple-touch-icon" href="https://www.awqaf.gov.ae/assets/mediakit/AwqafLogoIcon.png">

  <style>
    /* إزالة أي هوامش أو أشرطة تمرير مزدوجة من المتصفح */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfbf9; /* لون خلفية المنصة */
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbz_tHRo17p-C1ALBeDbhHAJ8mln1rZpiEHAPrPtRfdngLCiT3xpwPfX7uZfHrvLblSf/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      // محاولة تشغيل وضع الشاشة الكاملة
      const iframe = document.querySelector('iframe');
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen().catch((err) => {
          console.log('وضع ملء الشاشة يتطلب تفاعل المستخدم أولاً:', err.message);
        });
      }
    };
  </script>
</body>
</html>
